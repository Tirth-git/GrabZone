<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart | GrabZone</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cart.css" />
</head>
<body>
  <div class="cart-wrapper">
    <section id="header">
      <a href="index.html"><img src="img/logo.png" class="logo" alt="" height="90"></a>
      <div>
        <ul id="navbar">
          <li><a href="index.html">Home</a></li>
          <li><a href="store.html">Store</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a class="active" href="cart.html"><img src="img/shopping_cart_icon_transparent.png" height="60"></a></li>
        </ul>
      </div>
    </section>

    <main class="cart-main">
      <h1>Your Cart</h1>
      <div id="cart-items"></div>
      <p style="margin-left: 20px;">Total: ₹<span id="cart-total">0</span></p>
      <button onclick="showCheckoutPopup()" style="margin-left: 20px;">Proceed To Checkout</button>

      <div id="checkoutPopup" class="popup-overlay">
        <div class="popup-content">
          <h2>Checkout Details</h2>
          <form id="checkoutForm" autocomplete="off">
            <label>Country</label>
            <input type="text" placeholder="Enter country" required />

            <label>Full name (First and Last name)</label>
            <input type="text" placeholder="Enter Full Name" required />

            <label>Mobile number</label>
            <input type="tel" placeholder="Enter Mobile Number" required />

            <label>Flat, House no., Building, Company, Apartment</label>
            <input type="text" placeholder="Enter Flat No. , house No." required />

            <label>Area, Street, Sector, Village</label>
            <input type="text" placeholder="Enter Area, Street" required />

            <div class="row">
              <div>
                <label>Pincode</label>
                <input type="text" placeholder="Enter Pincode" required />
              </div>
              <div>
                <label>Town/City</label>
                <input type="text" placeholder="Enter City" required />
              </div>
            </div>

            <label>State</label>
            <input type="text" placeholder="Enter state" required />

            <label>Payment Method</label>
            <select id="payment" required>
              <option value="">Select</option>
              <option value="cod">Cash on Delivery</option>
              <option value="card">Credit/Debit Card</option>
              <option value="upi">UPI</option>
            </select>

            <div class="button-group">
              <button type="submit" class="submit-btn">Submit</button>
              <button type="button" onclick="closeCheckoutPopup()" class="cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <div class="custom-footer">
      <div class="footer-content">
        <p>&copy; 2025 GrabZone. All rights reserved.</p>
      </div>
    </div>
  </div>
  <script src="cart.js"></script>
</body>
</html>
