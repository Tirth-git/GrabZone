<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | GrabZine</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <section id="header">
        <a href="index.html"><img src="img/logo.png" class="logo" alt="" height="90"></a>
        <div>
            <ul id="navbar">
                <li><a class="active" href="index.html">Home</a></li>
                <li><a href="store.html">Store</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html"><img src="img/shopping_cart_icon_transparent.png" height="60"></a></li>
            </ul>
        </div>    
    </section>  
  </header>

  <section class="contact-section">
    <h1>Contact Us</h1>
    <p>Have a question or feedback? We'd love to hear from you!</p>

    <div class="contact-container">
      <form class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>

      <div class="contact-info">
        <h3>Connect with us</h3>
        <div class="social-buttons">
          <a href="https://www.instagram.com/tirth.cramble/" target="_blank">
            <img src="img/instagram.png" alt="Instagram" class="social-icon" />
          </a>
          <a href="https://twitter.com/yourprofile" target="_blank">
            <img src="img/twitter.png" alt="Twitter" class="social-icon" />
          </a>
          <a href="https://github.com/Tirth-git/GrabZone.git" target="_blank">
            <img src="img/githubb.png" alt="GitHub" class="social-icon" />
          </a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
